// Tabell QMS 1 — ISO 9001
function qmsBase(fte, riskCat) {
  const t = [[5, 1.5], [10, 2], [15, 2.5], [25, 3], [45, 4], [65, 5], [85, 6], [125, 7], [175, 8], [275, 9], [425, 10], [625, 11], [875, 12], [1175, 13], [1550, 14], [2025, 15], [2675, 16], [3450, 17], [4350, 18], [5450, 19], [6800, 20], [8500, 21], [10700, 22]];
  let base = 22;
  for (const [hi, d] of t) {
    if (fte <= hi) {
      base = d;
      break;
    }
  }
  if (fte > 10700) base = 22 + Math.ceil((fte - 10700) / 2200);
  if (riskCat === "high") base = r2(base + 1.0);
  if (riskCat === "low") base = r2(base - 0.5);
  return base;
}

// Tabell EMS 1 — ISO 14001 [hi, high, med, low, lim]
function emsBase(fte, complexity) {
  const t = [[5, 3, 2.5, 2.5, 2.5], [10, 3.5, 3, 3, 3], [15, 4.5, 3.5, 3, 3], [25, 5.5, 4.5, 3.5, 3], [45, 7, 5.5, 4, 3], [65, 8, 6, 4.5, 3.5], [85, 9, 7, 5, 3.5], [125, 11, 8, 5.5, 4], [175, 12, 9, 6, 4.5], [275, 13, 10, 7, 5], [425, 15, 11, 8, 5.5], [625, 16, 12, 9, 6], [875, 17, 13, 10, 6.5], [1175, 19, 15, 11, 7], [1550, 20, 16, 12, 7.5], [2025, 21, 17, 12, 8], [2675, 23, 18, 13, 8.5], [3450, 25, 19, 14, 9], [4350, 27, 20, 15, 10], [5450, 28, 21, 16, 11], [6800, 30, 23, 17, 12], [8500, 32, 25, 19, 13], [10700, 34, 27, 20, 14]];
  const ci = complexity === "high" ? 1 : complexity === "low" ? 3 : complexity === "limited" ? 4 : 2;
  for (const row of t) if (fte <= row[0]) return row[ci];
  return 34 + Math.ceil((fte - 10700) / 2200);
}

// ══════════════════════════════════════════
// SS-EN ISO/IEC 27006-1:2024 — Table C.1
// ISMS initialt (Steg 1 + Steg 2) — §9.1.4.2 normativt krav
// Värdena är EGNA och väsentligt högre än IAF MD 5
// ══════════════════════════════════════════
function iso27006Base(persons) {
  // [maxPersoner, auditdagar]
  const t = [[10, 5], [15, 6], [25, 7], [45, 8.5], [65, 10], [85, 11], [125, 12], [175, 13], [275, 14], [425, 15], [625, 16.5], [875, 17.5], [1175, 18.5], [1550, 19.5], [2025, 21], [2675, 22], [3450, 23], [4350, 24], [5450, 25], [6800, 26], [8500, 27], [10700, 28]];
  for (const [hi, d] of t) if (persons <= hi) return d;
  // >10700: följ progression
  return 28 + Math.ceil((persons - 10700) / 2200);
}

// ══════════════════════════════════════════
// ISO 27006-1:2024 C.3.4 — Reduktion för identiska aktiviteter (NORMATIV, ny i 2024)
// Metod: √antal_i_identisk_aktivitet, avrundat uppåt → reducerat personantal
// Används som ingångsvärde i Table C.1 FÖRE bastalsuppslag
// ══════════════════════════════════════════
function applyC34Reduction(totalPersons, identicalPct) {
  // identicalPct: andel av personerna som utför identiska aktiviteter (0–100)
  if (!identicalPct || identicalPct <= 0) return {
    reducedPersons: totalPersons,
    reduction: 0,
    desc: ""
  };
  const identicalCount = Math.round(totalPersons * identicalPct / 100);
  const remainingCount = totalPersons - identicalCount;
  // Kvadratrotsreduktion på den identiska gruppen
  const reducedIdentical = Math.ceil(Math.sqrt(identicalCount));
  const reducedPersons = remainingCount + reducedIdentical;
  return {
    reducedPersons,
    identicalCount,
    reducedIdentical,
    reduction: totalPersons - reducedPersons,
    desc: `C.3.4: ${identicalCount} pers. med identiska aktiviteter → √${identicalCount} = ${reducedIdentical} pers. Reducerat underlag: ${reducedPersons} pers.`
  };
}

// ══════════════════════════════════════════
// ISO 27006-1:2024 Annex D — Beräkningsmatris (informativ)
// D.2: Verksamhet och organisation (3 kategorier, 1–3 vardera → summa 3–9)
// D.3: IT-miljö (3 kategorier, 1–3 vardera → summa 3–9)
// D.4: Kombinationsmatris — Tabell D.4 i SS-EN ISO/IEC 27006-1:2024
// ══════════════════════════════════════════
// Returnerar intervall [min, max] per cell + valt värde (imsD4choice)
// IT låg (3–4), IT medel (5–6), IT hög (7–9)
// Verk. hög (7–9): +5%–+20%,  +10%–+50%,  +20%–+100%
// Verk. medel (5–6): −5%–−10%, 0%,          +10%–+50%
// Verk. låg (3–4): −10%–−30%, −5%–−10%,   +5%–+20%
function calcAnnexD(d2score, d3score, d4choice) {
  const itCat = d3score <= 4 ? "low" : d3score <= 6 ? "med" : "high";
  const bizCat = d2score <= 4 ? "low" : d2score <= 6 ? "med" : "high";
  // [min%, max%] per cell — Tabell D.4, informativt beräkningsexempel per 27006-1:2024 Annex D
  // Annex C (normativt) §9.1.4.2 kräver att C.3.5-faktorer beaktas. SBSC tillämpar D som strukturerat stöd.
  const intervals = {
    high: {
      low: [5, 20],
      med: [10, 50],
      high: [20, 100]
    },
    med: {
      low: [-10, -5],
      med: [0, 0],
      high: [10, 50]
    },
    low: {
      low: [-30, -10],
      med: [-10, -5],
      high: [5, 20]
    }
  };
  const [pctMin, pctMax] = intervals[bizCat][itCat];
  const midPct = pctMin === pctMax ? pctMin : Math.round((pctMin + pctMax) / 2);
  // d4choice: handläggarens valda procentjustering (null = använd mittpunkt)
  // d4choice: "conservative" | "normal" | "extended" (default: "normal")
  const chosenPct = d4choice === "conservative" ? pctMin : d4choice === "extended" ? pctMax : midPct;
  return {
    factor: 1 + chosenPct / 100,
    bizCat,
    itCat,
    pctMin,
    pctMax,
    midPct,
    chosenPct,
    intervalLabel: pctMin === pctMax ? pctMin + "%" : pctMin + "% till +" + pctMax + "%"
  };
}

// IAF MD 1:2023 §6.1.3.3
function md1Sample(sites, auditType) {
  if (sites <= 1) return {
    y: 1,
    formula: "Enplats"
  };
  const y = auditType === "surv" ? Math.ceil(0.6 * Math.sqrt(sites)) : Math.ceil(Math.sqrt(sites));
  const altY = auditType === "recert" ? Math.max(Math.ceil(0.8 * Math.sqrt(sites)), 1) : null;
  return {
    y: Math.max(y, 1),
    formula: auditType === "surv" ? `0,6·√${sites}` : `√${sites}`,
    altY,
    altFormula: altY ? `0,8·√${sites} (alternativ vid bevisad effektiv certifieringscykel, IAF MD 1 §6.1.3.3)` : null
  };
}

// IAF MD 11:2023 Annex 1 Figur 1 — max 20%
function md11ReductionFraction(intLevel, combPct) {
  const iSteps = [20, 40, 60, 80, 100];
  const cSteps = [0, 20, 40, 60, 80, 100];
  const matrix = {
    20: {
      0: 0,
      20: 0,
      40: 0,
      60: 0,
      80: 0,
      100: 0
    },
    40: {
      0: 0,
      20: 0.05,
      40: 0.05,
      60: 0.05,
      80: 0.05,
      100: 0.05
    },
    60: {
      0: 0,
      20: 0.05,
      40: 0.10,
      60: 0.10,
      80: 0.10,
      100: 0.10
    },
    80: {
      0: 0,
      20: 0.05,
      40: 0.10,
      60: 0.15,
      80: 0.15,
      100: 0.15
    },
    100: {
      0: 0,
      20: 0.05,
      40: 0.10,
      60: 0.15,
      80: 0.20,
      100: 0.20
    }
  };
  const iKey = iSteps.reduce((p, k) => Math.abs(k - intLevel) < Math.abs(p - intLevel) ? k : p, iSteps[0]);
  const cKey = cSteps.reduce((p, k) => Math.abs(k - combPct) < Math.abs(p - combPct) ? k : p, cSteps[0]);
  return Math.min(matrix[iKey][cKey], 0.20);
}

function calcEffectiveFte(f) {
  const full = parseInt(f.fteFulltime) || 0;
  const part = parseInt(f.ftePart) || 0;
  const partHours = parseFloat(f.ftePartHours) || 4;
  const seasonal = parseInt(f.fteSeasonal) || 0;
  const contractors = parseInt(f.fteContractors) || 0;
  const partEq = r2(part * (partHours / 8));
  const total = r2(full + partEq + seasonal + contractors);
  return {
    full,
    part,
    partEq,
    seasonal,
    contractors,
    total
  };
}

// CALC — IAF MD 5:2023 (9001/14001/45001) — OFÖRÄNDRAD LOGIK
// ══════════════════════════════════════════
function calcMD5(f) {
  const fteCalc = calcEffectiveFte(f);
  const fte = fteCalc.total || parseInt(f.fte) || 50;
  const sites = parseInt(f.sites) || 1;
  const stds = [f.s9001 && "ISO 9001", f.s14001 && "ISO 14001", f.s45001 && "ISO 45001"].filter(Boolean);
  if (!stds.length) return null;
  const perStd = [];
  if (f.s9001) perStd.push({
    std: "ISO 9001",
    base: qmsBase(fte, f.qmsRisk),
    tbl: "QMS 1 (" + f.qmsRisk + " risk)"
  });
  if (f.s14001) perStd.push({
    std: "ISO 14001",
    base: emsBase(fte, f.emsComplexity),
    tbl: "EMS 1 (" + f.emsComplexity + ")"
  });
  if (f.s45001) perStd.push({
    std: "ISO 45001",
    base: ohsBase(fte, f.ohsComplexity),
    tbl: "OH&SMS 1 (" + f.ohsComplexity + " risk)"
  });
  const adj = [];
  if (f.automation === "high") adj.push({
    label: "Automationsreduktion — hög automatiseringsgrad",
    ref: "IAF MD 5:2023 §8(v)f — ej tillämpligt för OH&SMS",
    delta: -1.0,
    red: true
  });else if (f.automation === "medium") adj.push({
    label: "Automationsreduktion — partiell",
    ref: "IAF MD 5:2023 §8(v)f",
    delta: -0.5,
    red: true
  });
  if (f.maturity === "high") adj.push({
    label: "Mognadsreduktion — välestablerat ledningssystem",
    ref: "IAF MD 5:2023 §8(v)c",
    delta: -1.0,
    red: true
  });else if (f.maturity === "medium") adj.push({
    label: "Mognadsreduktion — partiell",
    ref: "IAF MD 5:2023 §8(v)c",
    delta: -0.5,
    red: true
  });
  if (f.similar === "yes") adj.push({
    label: "Reduktion — likartade/repetitiva processer",
    ref: "IAF MD 5:2023 §2.3.4",
    delta: -0.5,
    red: true
  });
  if (f.offsite === "yes") adj.push({
    label: "Reduktion — personal primärt utanför anläggning",
    ref: "IAF MD 5:2023 §8(v)g — ej OH&SMS",
    delta: -0.5,
    red: true
  });
  const existing = {};
  [["9001", f.ex9001, f.ex9001y, f.ex9001cb], ["14001", f.ex14001, f.ex14001y, f.ex14001cb], ["45001", f.ex45001, f.ex45001y, f.ex45001cb]].forEach(([s, chk, yrs, body]) => {
    if (chk) existing[s] = {
      years: parseInt(yrs) || 1,
      body
    };
  });
  const existingKeys = Object.keys(existing);
  // IAF MD 5:2023 §8(v) Note: "if audit is conducted in accordance with IAF MD 11,
  // this justification is invalid as reduction will be calculated from the level of integration."
  // Prior knowledge-reduktionen är INTE tillämpbar om IMS-revision (MD 11) genomförs.
  // IMS-revision detekteras: fler än en standard inkl. 27001 UTAN iso27001separate-flagga,
  // eller fler än en MD5-standard med integrationsnivå > 0.
  const imsActive = stds.length > 1 && parseInt(f.imsIntLevel || "0") > 0 && !f.iso27001separate;
  if (existingKeys.length > 0 && !imsActive) {
    const avg = existingKeys.reduce((s, k) => s + existing[k].years, 0) / existingKeys.length;
    const bonus = avg >= 3 ? -1.0 : avg >= 2 ? -0.5 : 0;
    if (bonus < 0) adj.push({
      label: `Befintlig certifieringshistorik (${existingKeys.map(s => "ISO " + s).join(", ")})`,
      ref: "IAF MD 5:2023 §8(v)d+e — ej tillämpbar vid IMS-revision per MD 11",
      delta: bonus,
      red: true
    });
  }
  if (existingKeys.length > 0 && imsActive) {
    adj.push({
      label: "Prior knowledge — ej tillämpbar vid IMS-revision",
      ref: "IAF MD 5:2023 §8(v) Note: ogiltig vid MD 11-revision. IMS-reduktionen täcker detta.",
      delta: 0,
      red: false,
      imsNote: true
    });
  }
  const hasTransfer = existingKeys.some(s => stds.includes("ISO " + s) && existing[s]?.body?.trim());
  if (hasTransfer && !imsActive) adj.push({
    label: "Transferreduktion — prior knowledge/client preparedness",
    ref: "IAF MD 5:2023 §8(v)(d)+(e) — befintlig certifieringshistorik hos annat ackrediterat organ",
    delta: -0.5,
    red: true,
    transfer: true
  });
  if (hasTransfer && imsActive) adj.push({
    label: "Transfer — ej separat reduktion vid IMS-revision",
    ref: "IAF MD 5:2023 §8(v) Note: ogiltig vid MD 11-revision. IMS-reduktionen täcker detta.",
    delta: 0,
    red: false,
    imsNote: true
  });
  if (f.complexity === "high") adj.push({
    label: "Komplexitetstillägg — många unika processer",
    ref: "IAF MD 5:2023 §8(i)e",
    delta: 1.0,
    red: false
  });
  if (f.regulatory === "high") adj.push({
    label: "Regulatoriskt tillägg",
    ref: "IAF MD 5:2023 §8(i)d",
    delta: 0.5,
    red: false
  });
  if (f.outsourcing === "yes") adj.push({
    label: "Outsourcingtillägg — outsourcade processer inom scope",
    ref: "IAF MD 5:2023 §11",
    delta: 0.5,
    red: false
  });
  if (f.shifts === "yes" && (f.s9001 || f.s14001)) adj.push({
    label: "Skifttillägg — QMS/EMS flerskiftsdrift",
    ref: "IAF MD 5:2023 §3.7",
    delta: 0.5,
    red: false
  });
  if (f.shifts === "yes" && f.s45001) adj.push({
    label: "Skifttillägg — OH&SMS: skift inom OCH utanför kontorstid",
    ref: "IAF MD 5:2023 §3.7 — kräver audit på båda skiften under cykel 1",
    delta: 1.0,
    red: false
  });
  if (f.tempSites === "yes") adj.push({
    label: "Tillägg — tillfälliga arbetsplatser inom scope",
    ref: "IAF MD 5:2023 §9",
    delta: 0.5,
    red: false
  });
  if (f.multilang === "yes") adj.push({
    label: "Tillägg — flerspråkig verksamhet / tolk",
    ref: "IAF MD 5:2023 §8(i)b",
    delta: 0.5,
    red: false
  });
  if (f.ohsRisk === "high" && f.s45001) adj.push({
    label: "OH&S-risktillägg — hög riskprofil",
    ref: "IAF MD 5:2023 §8(iv)",
    delta: 0.5,
    red: false
  });
  const netDelta = adj.reduce((s, a) => s + a.delta, 0);
  // 30%-tak §3.9: golv = bas × 0.70
  let sumAdj = 0;
  const perStdAdj = perStd.map(ps => {
    const floor = r2(ps.base * 0.70);
    const adjusted = r2(Math.max(ps.base + netDelta, floor));
    sumAdj += adjusted;
    return {
      ...ps,
      floor,
      adjusted
    };
  });
  sumAdj = r2(sumAdj);
  const sumBases = r2(perStd.reduce((s, p) => s + p.base, 0));

  // IAF MD 11:2023 IMS-integrationsreduktion — max 20%
  let imsRed = 0,
    imsPct = "0%";
  const intLevel = parseInt(f.imsIntLevel) || 60;
  const combPct = parseInt(f.imsCombPct) || 50;
  if (stds.length > 1) {
    const frac = md11ReductionFraction(intLevel, combPct);
    imsRed = r2(sumAdj * frac);
    imsPct = Math.round(frac * 100) + "%";
  }
  const afterIms = r2(sumAdj - imsRed);

  // IAF MD 1:2023 flerplats
  const sampleInfo = md1Sample(sites, "initial");
  const siteExtra = sites > 1 ? r2((sampleInfo.y - 1) * r2(afterIms / sites) * 0.5) : 0;
  const totalInit = r2(afterIms + siteExtra);
  const savedDays = r2(sumBases - totalInit);
  const savedPct = sumBases > 0 ? Math.round(savedDays / sumBases * 100) : 0;
  const s1frac = parseInt(f.stage1Pct) === 33 ? 0.33 : 0.25;
  const stage1 = r2(Math.max(totalInit * s1frac, 0.5));
  const stage2 = r2(Math.max(totalInit - stage1, 0.5));
  const surv = r2(Math.max(totalInit / 3, 1));
  const recert = r2(Math.max(totalInit * (2 / 3), 1));
  return {
    stds,
    fte,
    fteCalc,
    sites,
    perStdAdj,
    sumBases,
    sumAdj,
    adj,
    netDelta,
    imsRed,
    imsPct,
    intLevel,
    combPct,
    siteExtra,
    sampleInfo,
    totalInit,
    savedDays,
    savedPct,
    stage1,
    stage2,
    surv,
    recert,
    existing,
    existingKeys,
    hasTransfer,
    regelverk: "IAF MD 5:2023 (Issue 4, V3)"
  };
}

// ══════════════════════════════════════════
// CALC — SS-EN ISO/IEC 27006-1:2024 — OMSKRIVEN
// Normativ bas: §9.1.4.2 → Annex C
// Informativ beräkningsmetodik: Annex D
// ══════════════════════════════════════════
function calc27006(f) {
  const totalPersons = parseInt(f.imsPersons) || 50;
  const sites = parseInt(f.sites) || 1;

  // ── STEG 1: C.3.4 — Reduktion för identiska aktiviteter (normativ, ny i 2024) ──
  const identicalPct = parseInt(f.imsIdenticalPct) || 0;
  const c34 = applyC34Reduction(totalPersons, identicalPct);
  const persons = c34.reducedPersons; // ingångsvärde i Table C.1

  // ── STEG 2: Table C.1 — Bastal (normativt) ──
  const base = iso27006Base(persons);

  // ── STEG 3: Annex D — Beräkningsmatris (informativ) ──
  // D.2: Verksamhet och organisation — tre kategorier, 1–3 vardera
  const d2biz = parseInt(f.imsD2biz) || 2; // typ av verksamhet/reglering
  const d2proc = parseInt(f.imsD2proc) || 2; // processer/uppgifter
  const d2mgmt = parseInt(f.imsD2mgmt) || 2; // mognad av ledningssystem
  const d2score = d2biz + d2proc + d2mgmt; // 3–9

  // D.3: IT-miljö — tre kategorier, 1–3 vardera
  const d3infra = parseInt(f.imsD3infra) || 2; // IT-infrastrukturkomplexitet
  const d3outsource = parseInt(f.imsD3outsource) || 2; // outsourcing/molntjänster
  const d3dev = parseInt(f.imsD3dev) || 1; // systemutveckling
  const d3score = d3infra + d3outsource + d3dev; // 3–9

  const annexD = calcAnnexD(d2score, d3score, f.imsD4choice);
  // D.4-faktorn multipliceras mot Table C.1 (inte adderas)
  const afterAnnexD = r2(base * annexD.factor);

  // ── STEG 4: C.3.5 — Ytterligare justeringsfaktorer ──
  const adj = [];

  // C.3.5(c): Tidigare prestanda / mognad (hanteras delvis via D.2mgmt men kan justeras ytterligare)
  if (f.imsSoaMaturity === "high") adj.push({
    label: "Mognadsreduktion — välestablerat ISMS, fullständig SoA",
    ref: "27006-1:2024 C.3.5(c) — hög mognad reducerar audittid utöver D.2-bedömningen",
    delta: -0.5,
    red: true
  });

  // C.3.5(i): Surveillance/omcertifiering — grad av förändring
  if (f.imsLowChange === "yes") adj.push({
    label: "Reduktion — begränsad förändring sedan senaste revision",
    ref: "27006-1:2024 C.3.5(i) — låg förändringsgrad reducerar surveillance/omcertifieringstid",
    delta: -0.5,
    red: true
  });

  // C.3.5: Regulatoriska krav
  if (f.imsRegulatory === "high") adj.push({
    label: "Regulatoriskt tillägg — NIS2/säkerhetsskydd/DORA",
    ref: "27006-1:2024 C.3.5 — höga regulatoriska krav ökar revisionsdjupet",
    delta: 0.5,
    red: false
  });

  // C.3.5: Flerspråkighet / tolk
  if (f.multilang === "yes") adj.push({
    label: "Tillägg — flerspråkig verksamhet / tolk krävs",
    ref: "27006-1:2024 C.3.5 / IAF MD 5:2023 §8(i)b",
    delta: 0.5,
    red: false
  });

  // IAF MD 2:2023: Transfer
  if (f.ex27001 && f.ex27001cb?.trim()) adj.push({
    label: "Transferreduktion — befintligt ISO 27001-certifikat",
    ref: "IAF MD 2:2023 §2.3 — certcykel fortsätter från utfärdande organ",
    delta: -0.5,
    red: true,
    transfer: true
  });else if (f.ex27001) {
    const bonus = parseInt(f.ex27001y) >= 3 ? -0.5 : parseInt(f.ex27001y) >= 2 ? -0.25 : 0;
    if (bonus < 0) adj.push({
      label: "Mognadsreduktion — befintlig 27001-historik",
      ref: "27006-1:2024 C.3.5(c) + IAF MD 2:2023",
      delta: bonus,
      red: true
    });
  }
  const netAdj = adj.reduce((s, a) => s + a.delta, 0);
  const afterAdj = r2(afterAnnexD + netAdj);

  // ── STEG 5: C.3.6 — 30%-tak (normativt) ──
  // Avvikelse får aldrig överstiga 30% mot Table C.1-värdet
  const floor = r2(base * 0.70);
  const totalAdj = r2(Math.max(afterAdj, floor));

  // ── STEG 6: C.6 — Flerplats ──
  const sampleInfo = md1Sample(sites, "initial");
  const siteExtra = sites > 1 ? r2((sampleInfo.y - 1) * r2(totalAdj / sites) * 0.5) : 0;
  let totalInit = r2(totalAdj + siteExtra);

  // ── STEG 7: C.7 — Scopeutökning ──
  // +0,5 dag kombinerat med surveillance/recert, +1,0 dag separat audit
  const scopeExt = f.imsScopeExt === "combined" ? 0.5 : f.imsScopeExt === "separate" ? 1.0 : 0;
  if (scopeExt > 0) totalInit = r2(totalInit + scopeExt);
  const savedDays = r2(base - totalAdj);
  const savedPct = base > 0 ? Math.round(Math.max(savedDays, 0) / base * 100) : 0;
  const s1frac27 = parseInt(f.stage1Pct) === 33 ? 0.33 : 0.25;
  const stage1 = r2(Math.max(totalInit * s1frac27, 1));
  const stage2 = r2(totalInit - stage1);
  const surv = r2(Math.max(totalInit / 3, 1));
  const recert = r2(Math.max(totalInit * (2 / 3), 1));
  return {
    totalPersons,
    persons,
    c34,
    base,
    d2score,
    d3score,
    annexD,
    afterAnnexD,
    adj,
    netAdj,
    afterAdj,
    floor,
    totalAdj,
    siteExtra,
    sampleInfo,
    scopeExt,
    totalInit,
    savedDays,
    savedPct,
    stage1,
    stage2,
    surv,
    recert,
    regelverk: "SS-EN ISO/IEC 27006-1:2024 (Annex C normativ)"
  };
}

// IAF MD 11:2023 — integration MD5+27001
function calcMD11Integration(md5, iso27001, f) {
  if (!md5 || !iso27001) return null;
  const combined = r2(md5.totalInit + iso27001.totalInit);
  const intLevel = parseInt(f.imsIntLevel) || 60;
  const combPct = parseInt(f.imsCombPct) || 50;
  const frac = md11ReductionFraction(intLevel, combPct);
  const reduction = r2(combined * frac);
  const total = r2(combined - reduction);
  return {
    combined,
    reduction,
    reductionPct: Math.round(frac * 100) + "%",
    total,
    intLevel,
    combPct,
    ref: "IAF MD 11:2023 §2.1.2 + Annex 1 Figur 1 — max 20% av T"
  };
}

// ── Motiveringstext ──
function buildMotiv(f, md5, iso27001, integration) {
  const parts = [];
  const allStds = [...(md5?.stds || []), f.s27001 ? "ISO 27001" : null].filter(Boolean);
  // Certifieringstyp — formulering per IAF MD 2:2023
  const certTypeLabel = f.certType === "transfer" ? `transfer från ${f.transferOrg || "annat certifieringsorgan"} per IAF MD 2:2023 — certifieringscykeln fortsätter` : f.certType === "extension" ? "utökning av befintligt certifieringsscope" : f.ex27001 || Object.keys(md5?.existing || {}).length > 0 ? "utökning av befintlig certifiering" : "initial certifiering";
  parts.push(`SBSC har beräknat revisionstiden för ${f.cName || "kunden"} avseende ${certTypeLabel} mot ${allStds.join(", ")} i enlighet med tillämpliga regelverkskrav.`);
  if (md5) {
    const fc = md5.fteCalc;
    const fteDesc = fc && (fc.part > 0 || fc.seasonal > 0 || fc.contractors > 0) ? (() => {
      const parts = [];
      if (fc.full > 0) parts.push(`${fc.full} heltidsanställda`);
      if (fc.part > 0) parts.push(`${fc.part} deltidsanställda (${f.ftePartHours || 4}h/dag × 1/8 = ${fc.partEq} heltidsekvivalenter per §2.3.3)`);
      if (fc.seasonal > 0) parts.push(`${fc.seasonal} säsongsanställda per §2.3.1`);
      if (fc.contractors > 0) parts.push(`${fc.contractors} inhyrda inom scope per §1.9`);
      return parts.join(" + ") + " = " + fc.total + " effektiva FTE";
    })() : `${md5.fte} FTE`;
    const stdDescs = md5.perStdAdj.map(d => `${d.std}: ${fmt(d.base)} dag (Tabell ${d.tbl})`).join("; ");
    const reds = md5.adj.filter(r => r.red).map(r => r.label).join("; ");
    const adds = md5.adj.filter(r => !r.red).map(r => r.label).join("; ");
    // Beskrivande bedömningstexter för motiveringstexten
    const maturityDesc = f.maturity === "high" ? "välestablerat ledningssystem med dokumenterad revisionshistorik (>3 år)" : f.maturity === "low" ? "nytt ledningssystem utan ISO-historik" : "etablerat ledningssystem (1–3 år)";
    const autoDesc = f.automation === "high" ? "hög automatiseringsgrad (majoriteten maskinellt styrd)" : f.automation === "medium" ? "viss automatisering i administrativa processer" : "låg automatiseringsgrad, manuella processer";
    const offsiteDesc = f.offsite === "yes" ? "stor andel fältpersonal som primärt arbetar på kundanläggningar" : "personal primärt på fast anläggning";
    const complexDesc = f.complexity === "high" ? "hög processkomplexitet med många unika processer" : f.complexity === "low" ? "låg processkomplexitet med enkla standardiserade processer" : "normal processkomplexitet";
    const regDesc = f.regulatory === "high" ? "höga regulatoriska krav (säkerhetsskyddslagen/NIS2/MSB)" : f.regulatory === "low" ? "inga eller få branschspecifika regulatoriska krav" : "normala regulatoriska krav via branschcertifikat";
    const factorDesc = `Bedömningen grundas på: ${maturityDesc}, ${autoDesc}, ${offsiteDesc}, ${complexDesc} och ${regDesc}.`;
    parts.push(`För ${md5.stds.join(", ")} tillämpas IAF MD 5:2023 (Issue 4, V3). Effektivt antal anställda per §2.3: ${fteDesc}, intervall ${fteRange(md5.fte)}. Basnivå: ${stdDescs}. Summa okorrigerat: ${fmt(md5.sumBases)} dag.` + (reds ? ` Reduktioner: ${reds}.` : "") + (adds ? ` Tillägg: ${adds}.` : "") + ` IAF MD 5:2023 §3.9: max 30% reduktion per standard. ${factorDesc}`);
    if (md5.stds.length > 1) {
      const intCriteria = [["imsInt1", "Ledningssystemet är ett och samma"], ["imsInt2", "Ledningens genomgång sker övergripande"], ["imsInt3", "Interna revisioner utförs på ett snarlikt sätt"], ["imsInt4", "Policy och mål utförs på ett snarlikt sätt"], ["imsInt5", "Processer utförs på ett snarlikt sätt"], ["imsInt6", "Förbättringsarbetet utförs på ett snarlikt sätt"]];
      const bedömda = intCriteria.filter(([k]) => f[k] && f[k] !== "");
      const helts = intCriteria.filter(([k]) => f[k] === "helt").map(([, l]) => l);
      const delvis = intCriteria.filter(([k]) => f[k] === "delvis").map(([, l]) => l);
      const nejs = intCriteria.filter(([k]) => f[k] === "nej").map(([, l]) => l);
      const intDesc = bedömda.length > 0 ? (helts.length > 0 ? ` Fullt integrerade kriterier: ${helts.join("; ")}.` : "") + (delvis.length > 0 ? ` Delvis integrerade kriterier: ${delvis.join("; ")}.` : "") + (nejs.length > 0 ? ` Ej integrerade kriterier: ${nejs.join("; ")}.` : "") : " Integrationsnivå uppskattad av handläggaren utan fullständig kriterieanalys.";
      parts.push(`Integrerat ledningssystem — IAF MD 11:2023 §2.1.2: integrationsnivå ${md5.intLevel}%, revisorskompetens ${md5.combPct}% → reduktion ${md5.imsPct} (max 20% av T).${intDesc} Integrationsnivån ska bekräftas vid Steg 1 per §2.1.1(iv).`);
    }
    if (md5.siteExtra > 0) {
      const sdet = (f.siteDetails || []).filter(d => d && d.city);
      const hqSite = sdet.find(d => d.hq);
      const siteList = sdet.length > 0 ? " Granskade platser: " + sdet.map(d => `${d.city}${d.hq ? " (centralfunktion)" : ""}${d.fte ? " — " + d.fte + " FTE" : ""}`).join(", ") + "." : "";
      const survSample = md1Sample(parseInt(f.sites) || 1, "surv");
      parts.push(`Organisation med flera certifieringsplatser: ${f.sites} fasta certifieringsplatser. Stickprov beräknas per IAF MD 1:2023 §6.1.3.3: initial y = ⌈√${f.sites}⌉ = ${md5.sampleInfo.y} platser, periodisk revision y = ⌈0,6·√${f.sites}⌉ = ${survSample.y} platser/år. Centralfunktionen ingår alltid i stickprovet per §6.1.3.3.${siteList}${hqSite ? " Centralfunktion: " + hqSite.city + "." : ""} Tidstillägg per samplad plats utöver centralfunktion: 50% av platskostnad per §7.3.1.`);
    }
    if (f.tempSites === "yes") {
      const tdesc = f.tempSiteDesc ? ` ${f.tempSiteDesc}` : "";
      parts.push(`Tillfälliga arbetsplatser (temporary sites) ingår i scope per IAF MD 5:2023 §9.${tdesc} Stickprovsurval fastställs av revisorn vid auditplaneringen.`);
    }
