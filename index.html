<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f3ede4; font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { opacity: 1; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #c9c9d1; border-radius: 3px; }

input:focus, select:focus, textarea:focus { outline: none; border-color: #FFA300 !important; box-shadow: 0 0 0 3px rgba(255,163,0,0.15) !important; }
input:hover:not(:focus), select:hover:not(:focus) { border-color: #b8b8c2; }
button:active { transform: scale(0.98); }
* { transition: border-color .15s ease, box-shadow .15s ease; }
button { transition: background .18s ease, color .18s ease, transform .12s ease, box-shadow .18s ease; }
button:hover { transform: translateY(-1px); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes floatSoft { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
@keyframes pulseRing { 0% { box-shadow: 0 0 0 0 rgba(255,163,0,0.35); } 70% { box-shadow: 0 0 0 14px rgba(255,163,0,0); } 100% { box-shadow: 0 0 0 0 rgba(255,163,0,0); } }
.fade-up { animation: fadeUp .45s ease both; }
.secb { display: grid; grid-template-rows: minmax(0, 1fr); opacity: 1; transition: grid-template-rows .45s cubic-bezier(.32,.72,0,1), opacity .35s ease .08s; }
.secb.folded { grid-template-rows: 0fr; opacity: 0; pointer-events: none; transition: grid-template-rows .4s cubic-bezier(.32,.72,0,1), opacity .22s ease; }
.seci { overflow: hidden; min-height: 0; }
.secb:not(.folded) { grid-template-rows: minmax(0, 1fr); }
.secb:not(.folded) .seci { height: auto; overflow: visible; }
.slbl { transition: background .18s ease; border-radius: 8px 8px 0 0; }
.slbl:hover { background: rgba(0,0,0,0.035); }
.stag-1 { animation-delay: .08s; } .stag-2 { animation-delay: .16s; } .stag-3 { animation-delay: .26s; } .stag-4 { animation-delay: .38s; }
.lift { transition: transform .22s cubic-bezier(.32,.72,0,1), box-shadow .22s ease; }
.lift:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(16,24,32,0.12); }
.tabfade { animation: fadeUp .35s ease both; }
.chkrow { transition: background .15s ease; }
.chkrow:hover { background: rgba(0,0,0,0.04) !important; }
button { transition: transform .08s ease, box-shadow .15s ease; }
button:active { transform: scale(0.96); }
@keyframes popIn { 0% { transform: scale(0); opacity: 0; } 70% { transform: scale(1.18); } 100% { transform: scale(1); opacity: 1; } }
.pop-in { animation: popIn .38s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes tlPop { 0% { transform: scale(0); opacity: 0; } 75% { transform: scale(1.12); } 100% { transform: scale(1); opacity: 1; } }
.tl-pop { animation: tlPop .45s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes tlLine { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.tl-line { transform-origin: left center; animation: tlLine .65s ease-out both; animation-delay: .1s; }
@keyframes docRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
#doc-work > div > *, #doc-customer > div > * { animation: docRise .5s ease both; }
#doc-work > div > *:nth-child(1), #doc-customer > div > *:nth-child(1) { animation-delay: .04s; }
#doc-work > div > *:nth-child(2), #doc-customer > div > *:nth-child(2) { animation-delay: .1s; }
#doc-work > div > *:nth-child(3), #doc-customer > div > *:nth-child(3) { animation-delay: .16s; }
#doc-work > div > *:nth-child(4), #doc-customer > div > *:nth-child(4) { animation-delay: .22s; }
#doc-work > div > *:nth-child(5), #doc-customer > div > *:nth-child(5) { animation-delay: .28s; }
#doc-work > div > *:nth-child(6), #doc-customer > div > *:nth-child(6) { animation-delay: .34s; }

// Tabell QMS 1 — ISO 9001
function qmsBase(fte, riskCat) {
  const t = [[5, 1.5], [10, 2], [15, 2.5], [25, 3], [45, 4], [65, 5], [85, 6], [125, 7], [175, 8], [275, 9], [425, 10], [625, 11], [875, 12], [1175, 13], [1550, 14], [2025, 15], [2675, 16], [3450, 17], [4350, 18], [5450, 19], [6800, 20], [8500, 21], [10700, 22]];
  let base = 22;
  for (const [hi, d] of t) {
    if (fte <= hi) {
      base = d;
      break;
    }
  }
  if (fte > 10700) base = 22 + Math.ceil((fte - 10700) / 2200);
  if (riskCat === "high") base = r2(base + 1.0);
  if (riskCat === "low") base = r2(base - 0.5);
  return base;
}

// Tabell EMS 1 — ISO 14001 [hi, high, med, low, lim]
function emsBase(fte, complexity) {
  const t = [[5, 3, 2.5, 2.5, 2.5], [10, 3.5, 3, 3, 3], [15, 4.5, 3.5, 3, 3], [25, 5.5, 4.5, 3.5, 3], [45, 7, 5.5, 4, 3], [65, 8, 6, 4.5, 3.5], [85, 9, 7, 5, 3.5], [125, 11, 8, 5.5, 4], [175, 12, 9, 6, 4.5], [275, 13, 10, 7, 5], [425, 15, 11, 8, 5.5], [625, 16, 12, 9, 6], [875, 17, 13, 10, 6.5], [1175, 19, 15, 11, 7], [1550, 20, 16, 12, 7.5], [2025, 21, 17, 12, 8], [2675, 23, 18, 13, 8.5], [3450, 25, 19, 14, 9], [4350, 27, 20, 15, 10], [5450, 28, 21, 16, 11], [6800, 30, 23, 17, 12], [8500, 32, 25, 19, 13], [10700, 34, 27, 20, 14]];
  const ci = complexity === "high" ? 1 : complexity === "low" ? 3 : complexity === "limited" ? 4 : 2;
  for (const row of t) if (fte <= row[0]) return row[ci];
  return 34 + Math.ceil((fte - 10700) / 2200);
}

// Tabell OH&SMS 1 — ISO 45001 [hi, high, med, low]
function ohsBase(fte, complexity) {
  const t = [[5, 3, 2.5, 2.5], [10, 3.5, 3, 3], [15, 4.5, 3.5, 3], [25, 5.5, 4.5, 3.5], [45, 7, 5.5, 4], [65, 8, 6, 4.5], [85, 9, 7, 5], [125, 11, 8, 5.5], [175, 12, 9, 6], [275, 13, 10, 7], [425, 15, 11, 8], [625, 16, 12, 9], [875, 17, 13, 10], [1175, 19, 15, 11], [1550, 20, 16, 12], [2025, 21, 17, 12], [2675, 23, 18, 13], [3450, 25, 19, 14], [4350, 27, 20, 15], [5450, 28, 21, 16], [6800, 30, 23, 17], [8500, 32, 25, 19], [10700, 34, 27, 20]];
  const ci = complexity === "high" ? 1 : complexity === "low" ? 3 : 2;

// ══════════════════════════════════════════
// SS-EN ISO/IEC 27006-1:2024 — Table C.1
// ISMS initialt (Steg 1 + Steg 2) — §9.1.4.2 normativt krav
// Värdena är EGNA och väsentligt högre än IAF MD 5
// ══════════════════════════════════════════
function iso27006Base(persons) {
  // [maxPersoner, auditdagar]
  const t = [[10, 5], [15, 6], [25, 7], [45, 8.5], [65, 10], [85, 11], [125, 12], [175, 13], [275, 14], [425, 15], [625, 16.5], [875, 17.5], [1175, 18.5], [1550, 19.5], [2025, 21], [2675, 22], [3450, 23], [4350, 24], [5450, 25], [6800, 26], [8500, 27], [10700, 28]];
  for (const [hi, d] of t) if (persons <= hi) return d;
  // >10700: följ progression
  return 28 + Math.ceil((persons - 10700) / 2200);
}

// ══════════════════════════════════════════
// ISO 27006-1:2024 C.3.4 — Reduktion för identiska aktiviteter (NORMATIV, ny i 2024)
// Metod: √antal_i_identisk_aktivitet, avrundat uppåt → reducerat personantal
// Används som ingångsvärde i Table C.1 FÖRE bastalsuppslag
// ══════════════════════════════════════════
function applyC34Reduction(totalPersons, identicalPct) {
  // identicalPct: andel av personerna som utför identiska aktiviteter (0–100)
  if (!identicalPct || identicalPct <= 0) return {
    reducedPersons: totalPersons,
    reduction: 0,
    desc: ""
  };
  const identicalCount = Math.round(totalPersons * identicalPct / 100);
  const remainingCount = totalPersons - identicalCount;
  // Kvadratrotsreduktion på den identiska gruppen
  const reducedIdentical = Math.ceil(Math.sqrt(identicalCount));
  const reducedPersons = remainingCount + reducedIdentical;
  return {
    reducedPersons,
    identicalCount,
    reducedIdentical,
    reduction: totalPersons - reducedPersons,
    desc: `C.3.4: ${identicalCount} pers. med identiska aktiviteter → √${identicalCount} = ${reducedIdentical} pers. Reducerat underlag: ${reducedPersons} pers.`
  };
}

// ══════════════════════════════════════════
// ISO 27006-1:2024 Annex D — Beräkningsmatris (informativ)
// D.2: Verksamhet och organisation (3 kategorier, 1–3 vardera → summa 3–9)
// D.3: IT-miljö (3 kategorier, 1–3 vardera → summa 3–9)
// D.4: Kombinationsmatris — Tabell D.4 i SS-EN ISO/IEC 27006-1:2024
// ══════════════════════════════════════════
// Returnerar intervall [min, max] per cell + valt värde (imsD4choice)
// IT låg (3–4), IT medel (5–6), IT hög (7–9)
// Verk. hög (7–9): +5%–+20%,  +10%–+50%,  +20%–+100%
// Verk. medel (5–6): −5%–−10%, 0%,          +10%–+50%
// Verk. låg (3–4): −10%–−30%, −5%–−10%,   +5%–+20%
function calcAnnexD(d2score, d3score, d4choice) {
  const itCat = d3score <= 4 ? "low" : d3score <= 6 ? "med" : "high";
  const bizCat = d2score <= 4 ? "low" : d2score <= 6 ? "med" : "high";
  // [min%, max%] per cell — Tabell D.4, informativt beräkningsexempel per 27006-1:2024 Annex D
  // Annex C (normativt) §9.1.4.2 kräver att C.3.5-faktorer beaktas. SBSC tillämpar D som strukturerat stöd.
  const intervals = {
    high: {
      low: [5, 20],
      med: [10, 50],
      high: [20, 100]
    },
    med: {
      low: [-10, -5],
      med: [0, 0],
      high: [10, 50]
    },
    low: {
      low: [-30, -10],
      med: [-10, -5],
      high: [5, 20]
    }
  };
  const [pctMin, pctMax] = intervals[bizCat][itCat];
  const midPct = pctMin === pctMax ? pctMin : Math.round((pctMin + pctMax) / 2);
  // d4choice: handläggarens valda procentjustering (null = använd mittpunkt)
  // d4choice: "conservative" | "normal" | "extended" (default: "normal")
  const chosenPct = d4choice === "conservative" ? pctMin : d4choice === "extended" ? pctMax : midPct;
  return {
    factor: 1 + chosenPct / 100,
    bizCat,
    itCat,
    pctMin,
    pctMax,
    midPct,
    chosenPct,
    intervalLabel: pctMin === pctMax ? pctMin + "%" : pctMin + "% till +" + pctMax + "%"
  };
}

  { id: "tillv_ren", label: "Tillverkare utan kemisk ytbehandling", qms: "medium", ems: "low", ohs: "medium" },
  { id: "annan", label: "Annan / anpassad (välj nivåer manuellt)", qms: null, ems: null, ohs: null }
];
// Nivånamn för visning
const LVL_NAME = { low: "Låg", limited: "Begränsad", medium: "Medel", high: "Hög" };
// Flervalskundtyper: effektiv id-lista (bakåtkompatibel med gamla enval-fältet customerType)
function ctIds(f) {
  if (f.customerTypes && f.customerTypes.length) return f.customerTypes;
  return f.customerType ? [f.customerType] : [];
}
// Nivåförslag vid en eller flera verksamheter: max per dimension, med styrande verksamhet spårad.
// SBSC-praxis (IAF MD 5: organisationens faktiska aktiviteter avgör kategorin): mest krävande verksamhet styr.
function ctSuggestionFrom(ids) {
  const cts = ids.map(id => CUSTOMER_TYPES.find(c => c.id === id)).filter(c => c && c.qms);
  if (cts.length === 0) return null;
  const rq = { low: 0, medium: 1, high: 2 };
  const re = { limited: 0, low: 1, medium: 2, high: 3 };
  const iq = ["low", "medium", "high"], ie = ["limited", "low", "medium", "high"];
  let q = -1, e = -1, o = -1, qBy = null, eBy = null, oBy = null;
  cts.forEach(c => {
    if (rq[c.qms] > q) { q = rq[c.qms]; qBy = c; }
    if (re[c.ems] > e) { e = re[c.ems]; eBy = c; }
    if (rq[c.ohs] > o) { o = rq[c.ohs]; oBy = c; }
  });
  return { qms: iq[q], ems: ie[e], ohs: iq[o], qmsBy: qBy, emsBy: eBy, ohsBy: oBy, types: cts };
}
function ctSuggestion(f) { return ctSuggestionFrom(ctIds(f)); }
// Avvikelser NEDÅT från vald kundtyps nivåförslag (IAF MD 5:2023 kräver dokumentation vid sänkt kategori)
function levelDeviations(f) {
  const sug = ctSuggestion(f);
  if (!sug) return [];
  const rq = { low: 0, medium: 1, high: 2 };
  const re = { limited: 0, low: 1, medium: 2, high: 3 };
  const out = [];
  if (f.s9001 && rq[f.qmsRisk] < rq[sug.qms]) out.push({ std: "ISO 9001", from: sug.qms, to: f.qmsRisk });
  if (f.s14001 && re[f.emsComplexity] < re[sug.ems]) out.push({ std: "ISO 14001", from: sug.ems, to: f.emsComplexity });
  if (f.s45001 && rq[f.ohsComplexity] < rq[sug.ohs]) out.push({ std: "ISO 45001", from: sug.ohs, to: f.ohsComplexity });
  return out;
}

const KONCERN_Q = [

  { id: "kq2", ref: "§5.2", txt: "En central funktion är identifierad — den är del av organisationen och EJ utkontrakterad" },
  { id: "kq3", ref: "§5.3", txt: "Centralfunktionen har organisatoriskt mandat att definiera, upprätta och underhålla ledningssystemet" },
  { id: "kq4", ref: "§5.4", txt: "Ledningssystemet är föremål för en centraliserad ledningens genomgång" },

];
// Konservativ default (SBSC-praxis att fastställa): alla sex §5-krav är skall-krav.
// Endast "Ja" på samtliga = kvalificerad. "Delvis"/"Nej" = ej kvalificerad ännu + åtgärd.
function koncernVerdict(f) {
  const nej = [], delvis = [], tomma = [];
  KONCERN_Q.forEach(q => {
    const v = f[q.id] || "";
    if (v === "nej") nej.push(q); else if (v === "delvis") delvis.push(q); else if (v === "") tomma.push(q);
  });
  const qualified = nej.length === 0 && delvis.length === 0 && tomma.length === 0;
  return { qualified, nej, delvis, tomma };
}

// IAF MD 1:2023 §6.1.3.3
function md1Sample(sites, auditType) {
  if (sites <= 1) return {
    y: 1,
    formula: "Enplats"
  };
  // IAF MD 1 §6.1.3.3: recert default = 0.8√x (kundvänligaste tillåtna), konservativt = √x
  const yBase = auditType === "surv" ? Math.ceil(0.6 * Math.sqrt(sites))
              : auditType === "recert" ? Math.max(Math.ceil(0.8 * Math.sqrt(sites)), 1)
              : Math.ceil(Math.sqrt(sites));
  const altY = auditType === "recert" ? Math.ceil(Math.sqrt(sites)) : null;
  return {
    y: Math.max(yBase, 1),
    formula: auditType === "surv" ? `0,6·√${sites}`
            : auditType === "recert" ? `0,8·√${sites}`
            : `√${sites}`,
    altY,
    altFormula: altY ? `√${sites} (konservativt alternativ om effektivitet ej bevisad, IAF MD 1 §6.1.3.3)` : null
  };
}

// IAF MD 11:2023 Annex 1 Figur 1 — max 20%
function md11ReductionFraction(intLevel, combPct) {
  const iSteps = [20, 40, 60, 80, 100];
  const cSteps = [0, 20, 40, 60, 80, 100];
  const matrix = {
    20: {
      0: 0,
      20: 0,
      40: 0,
      60: 0,
      80: 0,
      100: 0
    },
    40: {
      0: 0,
      20: 0.05,
      40: 0.05,
      60: 0.05,
      80: 0.05,
      100: 0.05
    },
    60: {
      0: 0,
      20: 0.05,
      40: 0.10,
      60: 0.10,
      80: 0.10,
      100: 0.10
    },
    80: {
      0: 0,
      20: 0.05,
      40: 0.10,
      60: 0.15,
      80: 0.15,
      100: 0.15
    },
    100: {
      0: 0,
      20: 0.05,
      40: 0.10,
      60: 0.15,
      80: 0.20,
      100: 0.20
    }
  };
  // Runda uppåt vid oavgjort → högre integrationsnivå/kompetens → mer reduktion (kundvänlig tolkning, IAF MD 11 Annex 1)
  const iKey = iSteps.reduce((p, k) => Math.abs(k - intLevel) <= Math.abs(p - intLevel) ? k : p, iSteps[0]);
  const cKey = cSteps.reduce((p, k) => Math.abs(k - combPct) <= Math.abs(p - combPct) ? k : p, cSteps[0]);
  return Math.min(matrix[iKey][cKey], 0.20);
}

// FTE-beräkning IAF MD 5:2023 §2.3
function calcEffectiveFte(f) {
  const full = parseInt(f.fteFulltime) || 0;
  const part = parseInt(f.ftePart) || 0;
  const partHours = parseFloat(f.ftePartHours) || 4;
  const seasonal = parseInt(f.fteSeasonal) || 0;
  // IAF MD 5:2023 §2.3.1: Vid säsongsverksamhet baseras antalet på peak-närvaro
  // (personalen som typiskt är på plats under högsäsong) — INGEN årsproportionering.
  const seasonalEq = seasonal; // full vikt = peak-närvaro
  const contractors = parseInt(f.fteContractors) || 0;
  const partEq = r2(part * (partHours / 8));
  const total = r2(full + partEq + seasonalEq + contractors);
  return {
    full,
    part,
    partEq,
    seasonal,
    seasonalEq,
    isSeasonal: (parseInt(f.fteSeasonal) || 0) > 0,
    contractors,
    total
  };
}

// CALC — IAF MD 5:2023 (9001/14001/45001) — OFÖRÄNDRAD LOGIK
// ══════════════════════════════════════════
function calcMD5(f) {
  const fteCalc = calcEffectiveFte(f);
  const fteRaw = fteCalc.total || parseInt(f.fte) || 50;
  // §2.3.4 — FTE-reduktion för likartade/repetitiva processer (SBSC fastställd rutin)
  // Reduktionen sker på FTE-nivå FÖRE tabelluppslag, inte som dagsjustering i efterhand
  let fte = fteRaw;
  let similarFteInfo = null;
  // §2.3.4 SBSC-beslut: enbart larmcentraler och bevakningsföretag, alltid 30 % FTE-reduktion (Alt A).
  // Ej tillämpligt för enbart ISO 45001 (OH&SMS). Gäller QMS/EMS.
  const hasMD5qmsEms = f.s9001 || f.s14001;
  if (f.similar === "larmcentral" || f.similar === "bevakning") {
    const simPct = 30;
    const reducedFte = Math.max(Math.round(fteRaw * (1 - simPct / 100)), 1);
    fte = reducedFte;
    similarFteInfo = {
      originalFte: fteRaw, simPct, reducedFte,
      verksamhet: f.similar === "larmcentral" ? "Larmcentral" : "Bevakningsföretag",
      desc: "§2.3.4 SBSC: " + (f.similar === "larmcentral" ? "Larmcentral" : "Bevakningsföretag") + " - 30% FTE-reduktion per SBSC:s fastställda rutin. FTE " + fteRaw + " -> " + reducedFte + " pers."
    };
  }
  const sites = parseInt(f.sites) || 1;
  const stds = [f.s9001 && "ISO 9001", f.s14001 && "ISO 14001", f.s45001 && "ISO 45001"].filter(Boolean);
  if (!stds.length) return null;
  const perStd = [];
  if (f.s9001) perStd.push({
    std: "ISO 9001",
    base: qmsBase(fte, f.qmsRisk),
    tbl: "QMS 1 (" + f.qmsRisk + " risk)"
  });
  if (f.s14001) perStd.push({
    std: "ISO 14001",
    base: emsBase(fte, f.emsComplexity),
    tbl: "EMS 1 (" + f.emsComplexity + ")"
  });
  if (f.s45001) perStd.push({
    std: "ISO 45001",
    base: ohsBase(fte, f.ohsComplexity),
    tbl: "OH&SMS 1 (" + f.ohsComplexity + " risk)"
  });
  const adj = [];
  if (f.automation === "high") { adj.push({
    label: "Automationsreduktion — hög automatiseringsgrad",
    ref: "IAF MD 5:2023 §8(v)f — ej tillämpligt för OH&SMS",
    delta: -1.0,
    red: true
  }); }else if (f.automation === "medium") adj.push({
    label: "Automationsreduktion — partiell",
    ref: "IAF MD 5:2023 §8(v)f",
    delta: -0.5,
    red: true
  });
  if (f.maturity === "high") { adj.push({
    label: "Mognadsreduktion — välestablerat ledningssystem",
    ref: "IAF MD 5:2023 §8(v)c",
    delta: -1.0,
    red: true
  }); }else if (f.maturity === "medium") adj.push({
    label: "Mognadsreduktion — partiell",
    ref: "IAF MD 5:2023 §8(v)c",
    delta: -0.5,
    red: true
  });
  // §2.3.4: likartade processer hanteras via FTE-reduktion FÖRE tabelluppslag (se similarFteInfo nedan)
  // Ingen dag-delta här — reduktionen sker på FTE-nivå, vilket är korrekt per regelverket
  if (f.offsite === "yes") adj.push({
    label: "Reduktion — personal primärt utanför anläggning",
    ref: "IAF MD 5:2023 §8(v)g — ej OH&SMS",
    delta: -0.5,
    red: true
  });
  const existing = {};
  [["9001", f.ex9001, f.ex9001y, f.ex9001cb], ["14001", f.ex14001, f.ex14001y, f.ex14001cb], ["45001", f.ex45001, f.ex45001y, f.ex45001cb]].forEach(([s, chk, yrs, body]) => {
    if (chk) existing[s] = {
      years: parseInt(yrs) || 1,
      body
    };
  });
  const existingKeys = Object.keys(existing);
  // IAF MD 5:2023 §8(v) Note: "if audit is conducted in accordance with IAF MD 11,
  // this justification is invalid as reduction will be calculated from the level of integration."
  // Prior knowledge-reduktionen är INTE tillämpbar om IMS-revision (MD 11) genomförs.
  // IMS-revision detekteras: fler än en standard inkl. 27001 UTAN iso27001separate-flagga,
  // eller fler än en MD5-standard med integrationsnivå > 0.
  const imsActive = stds.length > 1 && parseInt(f.imsIntLevel || "0") > 0 && !f.iso27001separate;
  if (existingKeys.length > 0 && !imsActive) {
    const avg = existingKeys.reduce((s, k) => s + existing[k].years, 0) / existingKeys.length;
    const bonus = avg >= 3 ? -1.0 : avg >= 2 ? -0.5 : 0;
    if (bonus < 0) adj.push({
      label: `Befintlig certifieringshistorik (${existingKeys.map(s => "ISO " + s).join(", ")})`,
      ref: "IAF MD 5:2023 §8(v)d+e — ej tillämpbar vid IMS-revision per MD 11",
      delta: bonus,
      red: true
    });
  }
  if (existingKeys.length > 0 && imsActive) {
    adj.push({
      label: "Prior knowledge — ej tillämpbar vid IMS-revision",
      ref: "IAF MD 5:2023 §8(v) Note: ogiltig vid MD 11-revision. IMS-reduktionen täcker detta.",
      delta: 0,
      red: false,
      imsNote: true
    });
  }
  const hasTransfer = existingKeys.some(s => stds.includes("ISO " + s) && existing[s]?.body?.trim());
  if (hasTransfer && !imsActive) adj.push({
    label: "Transferreduktion — prior knowledge/client preparedness",
    ref: "IAF MD 2:2023 §2.3.4 (transferprocess) + IAF MD 5:2023 §8(v)e (client preparedness)",
    delta: -0.5,
    red: true,
    transfer: true
  });
  if (hasTransfer && imsActive) adj.push({
    label: "Transfer — ej separat reduktion vid IMS-revision",
    ref: "IAF MD 5:2023 §8(v) Note: ogiltig vid MD 11-revision. IMS-reduktionen täcker detta.",
    delta: 0,
    red: false,
    imsNote: true
  });
  if (f.complexity === "high") adj.push({
    label: "Komplexitetstillägg — många unika processer",
    ref: "IAF MD 5:2023 §8(i)e — faktor; +1,0 d är SBSC:s kalibrerade kvantifiering per §3.4",
    delta: 1.0,
    red: false
  });
  if (f.regulatory === "high") adj.push({
    label: "Regulatoriskt tillägg",
    ref: "IAF MD 5:2023 §8(i)d — faktor; +0,5 d är SBSC:s kalibrering per §3.4",
    delta: 0.5,
    red: false
  });
  if (f.outsourcing === "yes") adj.push({
    label: "Outsourcingtillägg — outsourcade processer inom scope",
    ref: "IAF MD 5:2023 §11",
    delta: 0.5,
    red: false
  });
  if (f.shifts === "yes" && (f.s9001 || f.s14001)) adj.push({
    label: "Skifttillägg — QMS/EMS flerskiftsdrift",
    ref: "IAF MD 5:2023 §3.7",
    delta: 0.5,
    red: false
  });
  if (f.shifts === "yes" && f.s45001) adj.push({
    label: "Skifttillägg — OH&SMS: skift inom OCH utanför kontorstid",
    ref: "IAF MD 5:2023 §3.7 — kräver audit på båda skiften under cykel 1",
    delta: 1.0,
    red: false
  });
  if (f.tempSites === "yes") adj.push({
    label: "Tillägg — tillfälliga arbetsplatser inom scope",
    ref: "IAF MD 5:2023 §8(i)f + IAF MD 1:2023 §7.3.1 — faktor; +0,5 d är SBSC:s kalibrering per §3.4",
    delta: 0.5,
    red: false
  });
  if (f.multilang === "yes") adj.push({
    label: "Tillägg — flerspråkig verksamhet / tolk",
    ref: "IAF MD 5:2023 §8(i)b — faktor; +0,5 d är SBSC:s kalibrering per §3.4",
    delta: 0.5,
    red: false
  });
  if (f.ohsRisk === "high" && f.s45001) adj.push({
    label: "OH&S-risktillägg — hög riskprofil",
    ref: "IAF MD 5:2023 §8(iv) — faktor; +0,5 d är SBSC:s kalibrering per §3.4",
    delta: 0.5,
    red: false
  });
  // §8(v)a: ej designansvarig — gäller QMS only (kundvänlig tolkning: standard element utanför scope)
  if (f.notDesignResp === "yes" && f.s9001) adj.push({
    label: "Reduktion — ej designansvarig för produkt/tjänst (QMS)",
    ref: "IAF MD 5:2023 §8(v)a — standard elements not covered in scope (QMS only)",
    delta: -0.5,
    red: true
  });
  // §8(v)b: liten anläggning relativt personalstyrkan (t.ex. kontorslokaler)
  if (f.verySmallSite === "yes") adj.push({
    label: "Reduktion — liten anläggning relativt personalstyrkan",
    ref: "IAF MD 5:2023 §8(v)b — very small site for number of personnel",
    delta: -0.5,
    red: true
  });
  // §8(v)f: automation EJ tillämpbart för OH&SMS
  // §8(v)g: offsite EJ tillämpbart för OH&SMS
  // Per-standard delta: exkludera ej-tillämpbara faktorer för ISO 45001
  function stdSpecificDelta(stdName, adjList) {
    return adjList.reduce((s, a) => {
      if (stdName === "ISO 45001") {
        if (a.label.startsWith("Automationsreduktion")) return s; // §8(v)f
        if (a.label.startsWith("Reduktion — personal primärt utanför")) return s; // §8(v)g
      }
      return s + a.delta;
    }, 0);
  }
  const netDelta = adj.reduce((s, a) => s + a.delta, 0); // visningsändamål
  // 30%-tak §3.9: golv = bas × 0.70
  let sumAdj = 0;
  const perStdAdj = perStd.map(ps => {
    const floor = Math.ceil(ps.base * 0.70 * 2) / 2;
    const stdDelta = stdSpecificDelta(ps.std, adj);
    const adjusted = r2(Math.max(ps.base + stdDelta, floor));
    sumAdj += adjusted;
    return {
      ...ps,
      floor,
      adjusted
    };
  });
  sumAdj = r2(sumAdj);
  const sumBases = r2(perStd.reduce((s, p) => s + p.base, 0));

  // IAF MD 11:2023 IMS-integrationsreduktion — max 20%
  let imsRed = 0,
    imsPct = "0%";
  const intLevel = parseInt(f.imsIntLevel) || 60;
  const combPct = parseInt(f.imsCombPct) || 50;
  if (stds.length > 1) {
    const frac = md11ReductionFraction(intLevel, combPct);
    imsRed = r2(sumAdj * frac);
    imsPct = Math.round(frac * 100) + "%";
  }
  const afterIms = r2(sumAdj - imsRed);

  // IAF MD 1:2023 flerplats
  const sampleInfo = md1Sample(sites, "initial");
  // IAF MD 1 §6.2.1: om sampling ej är tillämplig revideras ALLA siter vid initial/omcert
  const koncernAllSites = !!f.koncernGuideOn && f.kSimilar === "nej";
  const effY = koncernAllSites ? sites : sampleInfo.y;
  const siteExtra = sites > 1 ? r2((effY - 1) * r2(afterIms / sites) * 0.5) : 0;
  let totalInit = r2(afterIms + siteExtra);
  const savedDays = r2(sumBases - totalInit);
  const savedPct = sumBases > 0 ? Math.round(savedDays / sumBases * 100) : 0;
  const s1frac = parseInt(f.stage1Pct) === 33 ? 0.33 : 0.25;
  // 80% planerad tid på plats (§2.1.2) — reducerar både mandagstal och pris.
  // Fulla värden (_full) behålls för dokumentets spårbarhet.
  const onsite80 = !!f.onsite80;
  const os = v => onsite80 ? r2(v * 0.8) : v;
  // Fulla audittiden enligt IAF MD 5 (oreducerad)
  const totalInitFull = totalInit;
  const stage1Full = r2(Math.max(totalInit * s1frac, 0.5));
  const stage2Full = r2(Math.max(totalInit - stage1Full, 0.5));
  // Standardmodell: periodisk = 1/3, omcert = 2/3 (mer tid vid omcertifiering)
  const survStd = r2(Math.max(totalInit / 3, 1));
  const recertStd = r2(Math.max(totalInit * (2 / 3), 1));
  // Jämn fördelning (valfritt): samma tid alla tre år = cykeltotal / 3
  const evenCycle = !!f.evenCycle;
  const cycleTotal = r2(survStd * 2 + recertStd);
  const evenPerYear = r2(Math.max(cycleTotal / 3, 1));
  const survFull = evenCycle ? evenPerYear : survStd;
  const recertFull = evenCycle ? evenPerYear : recertStd;
  // Effektiva värden (reducerade om onsite80) — styr mandagstabeller och pris
  totalInit = os(totalInit);
  const stage1 = os(stage1Full);
  const stage2 = os(stage2Full);
  const surv = os(survFull);
  const recert = os(recertFull);
  const onsiteOffDays = onsite80 ? r2(totalInitFull - totalInit) : 0;
  return {
    stds,
    fte,
    fteCalc,
    sites,
    perStdAdj,
    sumBases,
    sumAdj,
    adj,
    netDelta,
    imsRed,
    imsPct,
    intLevel,
    combPct,
    siteExtra,
    sampleInfo,
    totalInit,
    savedDays,
    savedPct,
    stage1,
    stage2,
    surv,
    recert,
    onsite80,
    totalInitFull,
    stage1Full,
    stage2Full,
    survFull,
    recertFull,
    onsiteOffDays,
    evenCycle,
    survStd,
    recertStd,
    cycleTotal,
    koncernAllSites,
    existing,
    existingKeys,
    hasTransfer,
    similarFteInfo,
    regelverk: "IAF MD 5:2023 (Issue 4, V3)"
  };
}

// ══════════════════════════════════════════
// CALC — SS-EN ISO/IEC 27006-1:2024 — OMSKRIVEN
// Normativ bas: §9.1.4.2 → Annex C
// Informativ beräkningsmetodik: Annex D
// ══════════════════════════════════════════
function calc27006(f) {
  const totalPersons = parseInt(f.imsPersons) || 50;
  const sites = parseInt(f.sites) || 1;

  // ── STEG 1: C.3.4 — Reduktion för identiska aktiviteter (normativ, ny i 2024) ──

  // ── STEG 3: Annex D — Beräkningsmatris (informativ) ──
  // D.2: Verksamhet och organisation — tre kategorier, 1–3 vardera

  const d2proc = parseInt(f.imsD2proc) || 2; // processer/uppgifter
  const d2mgmt = parseInt(f.imsD2mgmt) || 2; // mognad av ledningssystem
  const d2score = d2biz + d2proc + d2mgmt; // 3–9

  // D.3: IT-miljö — tre kategorier, 1–3 vardera
  const d3infra = parseInt(f.imsD3infra) || 2; // IT-infrastrukturkomplexitet
  const d3outsource = parseInt(f.imsD3outsource) || 2; // outsourcing/molntjänster
  const d3dev = parseInt(f.imsD3dev) || 1; // systemutveckling
  const d3score = d3infra + d3outsource + d3dev; // 3–9

  const annexD = calcAnnexD(d2score, d3score, f.imsD4choice);

  // C.3.5(c): Tidigare prestanda / mognad (hanteras delvis via D.2mgmt men kan justeras ytterligare)
  if (f.imsSoaMaturity === "high") adj.push({
    label: "Mognadsreduktion — välestablerat ISMS, fullständig SoA",
    ref: "27006-1:2024 C.3.5(c) — hög mognad reducerar audittid utöver D.2-bedömningen",
    delta: -0.5,
    red: true

    ref: "27006-1:2024 C.3.5(i) — låg förändringsgrad reducerar surveillance/omcertifieringstid",

  // (redan inr\xe4knat i totalPersons \u2192 Table C.1). INTE MD 1:s \u221ax-stickprov.
  // Per C.6 kan tid allokeras \xf6ver platser, men totalen styrs av personantalet.
  // Om flera platser: liten kalibrerad till\xe4ggstid f\xf6r samordning/resor mellan platser
  // (SBSC-kalibrerat per C.6 st 3 \u2014 allokering \xf6ver platser, ej extra revisionsdagar fr\xe5n \u221ax).
  const siteCoordination = sites > 1 ? r2((sites - 1) * 0.25) : 0; // SBSC-kalibrerad samordningstid
  const siteExtra = siteCoordination;
  let totalInit = r2(totalAdj + siteExtra);

  // ── STEG 7: C.7 — Scopeutökning ──
  // +0,5 dag kombinerat med surveillance/recert, +1,0 dag separat audit
  const scopeExt = f.imsScopeExt === "combined" ? 0.5 : f.imsScopeExt === "separate" ? 1.0 : 0;
  if (scopeExt > 0) totalInit = r2(totalInit + scopeExt);

  const savedPct = base > 0 ? Math.round(Math.max(savedDays, 0) / base * 100) : 0;

  const stage2 = r2(totalInit - stage1);

  const recert = r2(Math.max(totalInit * (2 / 3), 1));
  return {

    persons,
    c34,
    base,
    d2score,
    d3score,
    annexD,
    afterAnnexD,
    adj,
    netAdj,
    afterAdj,
    floor,
    totalAdj,
    siteExtra,
    sites,
    scopeExt,
    totalInit,
    savedDays,
    savedPct,
    stage1,
    stage2,
    surv,
    recert,
    regelverk: "SS-EN ISO/IEC 27006-1:2024 (Annex C normativ)"

}

// IAF MD 11:2023 — integration MD5+27001
function calcMD11Integration(md5, iso27001, f) {

  const combPct = parseInt(f.imsCombPct) || 50;
  const frac = md11ReductionFraction(intLevel, combPct);

        parts.push("Bolag som omfattas av koncerncertifikatet (" + bol.length + " st): " + bol.map(b => (b.namn || "[namn saknas]") + (b.orgnr ? " (" + b.orgnr + ")" : "") + (b.roll === "central" ? " [CENTRALFUNKTION]" : "") + (b.fte ? ", " + b.fte + " FTE" : "") + ((b.cert || "").trim() ? ", befintliga cert: " + b.cert.trim() : "")).join("; ") + ".");
        const withCert = bol.filter(b => (b.cert || "").trim());
        if (withCert.length > 0) {
          parts.push("Cykelsynkronisering: " + withCert.length + " av bolagen har befintliga certifikat. Dessa hanteras enligt IAF MD 2:2023 (transfer) och synkroniseras till koncerncertifikatets gemensamma cykel. Befintlig certifieringshistorik beaktas i reduktionsunderlaget där tillämpligt.");
        }
        // Stegvis uppbyggnad — presentationslager som anropar calcMD5 per kumulativ fas (kärnlogiken orörd)
        const faser = [...new Set(bol.map(b => Math.max(1, parseInt(b.fas) || 1)))].sort((x, y) => x - y);
        if (faser.length > 1 && md5) {
          parts.push("STEGVIS UPPBYGGNAD AV KONCERNCERTIFIKATET (IAF MD 1:2023 \xA76.2.3 / \xA76.1.4.1)");
          parts.push("Fasberäkningarna använder bolagsregistrets FTE per fas och följer huvudberäkningens inställningar" + (f.onsite80 ? ", inklusive 80% planerad tid på plats" : "") + (f.evenCycle ? ", inklusive jämn cykelfördelning" : "") + ".");
          let prev = null;
          faser.forEach(fs => {
            const cum = bol.filter(b => (parseInt(b.fas) || 1) <= fs);
            const cumFte = cum.reduce((s, b) => s + (parseFloat(b.fte) || 0), 0);
            const cf = { ...f, sites: String(cum.length), fte: cumFte > 0 ? String(cumFte) : f.fte };
            const ck = calcMD5(cf);
            const names = bol.filter(b => (parseInt(b.fas) || 1) === fs).map(b => (b.namn || "[namn saknas]") + (b.orgnr ? " (" + b.orgnr + ")" : "")).join(", ");
            if (prev === null) {
              parts.push("Fas " + fs + " \u2014 initial certifiering: " + names + " (" + cum.length + " siter, " + (cumFte > 0 ? cumFte + " FTE" : "FTE enligt huvudberäkning") + "). Initial audittid " + fmt(ck.totalInit) + " dagar. Löpande därefter: periodisk revision " + fmt(ck.surv) + " dagar/år.");
            } else {
              const ansl = r2(Math.max(ck.totalInit - prev.totalInit, 1));
              parts.push("Fas " + fs + " \u2014 anslutning: " + names + ". Anslutningsrevision " + fmt(ansl) + " dagar \u2014 anslutande site revideras före upptagande i certifikatet (\xA76.2.3; vid sampling avgör certifieringsorganet aktiviteterna per \xA76.1.4.1 \u2014 SBSC:s praxis är att alltid revidera anslutande site; omfattning = tillkommande beräknad audittid för den utökade organisationen, minst 1 dag). Löpande efter fas " + fs + ": periodisk revision " + fmt(ck.surv) + " dagar/år, omcertifiering " + fmt(ck.recert) + " dagar.");
            }
            prev = ck;
          });
          parts.push("Efter varje anslutning kumuleras den nya siten med övriga vid fastställande av framtida periodisk- och omcertifieringstid (\xA76.2.3, \xA76.1.4.1). Ovanstående löpande tider avser certifikatets omfattning efter respektive fas.");
        } else if (faser.length > 1 && !md5) {
          parts.push("OBS: Stegvis fasberäkning genereras endast när minst en MD 5-standard ingår (ISO 9001/14001/45001). För en ren ISO 27001-koncern planeras faserna manuellt enligt ISO/IEC 27006-1 — kvalificeringsprotokollet och bolagsregistret ovan gäller oförändrat, och anslutningsprincipen (site revideras före upptagande, därefter kumulering) är densamma.");
        }
      }
    }
  if (iso27001) {
    // ISMS-integrationsstatus
    const imsIntStatus = f.imsIntegrationStatus === "integrated" ? "Kundens ISMS är integrerat med ett befintligt ledningssystem — gemensamma processer och/eller interna revisioner." : f.imsIntegrationStatus === "standalone" ? "Kundens ISMS är ett fristående system utan integration med andra ledningssystem." : f.imsIntegrationStatus === "partial" ? "Kundens ISMS är delvis integrerat med ett befintligt ledningssystem." : "";
    if (imsIntStatus) parts.push(imsIntStatus);
    const reds27 = iso27001.adj.filter(r => r.red).map(r => r.label).join("; ");
    const adds27 = iso27001.adj.filter(r => !r.red).map(r => r.label).join("; ");
    const c34desc = iso27001.c34.reduction > 0 ? ` C.3.4-reduktion (identiska aktiviteter): ${iso27001.totalPersons} pers. → ${iso27001.persons} pers. (${iso27001.c34.desc}).` : ` Inga identiska aktiviteter (C.3.4 ej tillämpat).`;
    const d4intervalStr = iso27001.annexD.pctMin === iso27001.annexD.pctMax ? (iso27001.annexD.pctMin >= 0 ? "+" : "") + iso27001.annexD.pctMin + "%" : "(" + (iso27001.annexD.pctMin >= 0 ? "+" : "") + iso27001.annexD.pctMin + "%) till (" + (iso27001.annexD.pctMax >= 0 ? "+" : "") + iso27001.annexD.pctMax + "%)";
    const d4choiceStr = (iso27001.annexD.chosenPct >= 0 ? "+" : "") + iso27001.annexD.chosenPct + "%";
    const d4bizLabel = iso27001.annexD.bizCat === "high" ? "hög" : iso27001.annexD.bizCat === "low" ? "låg" : "medel";
    const d4itLabel = iso27001.annexD.itCat === "high" ? "hög" : iso27001.annexD.itCat === "low" ? "låg" : "medel";
    // Beskrivande texter per D.2/D.3-val för motiveringstext
    const d2bizDesc = f.imsD2biz === "3" ? "verkar i reglerad sektor eller hanterar samhällskritisk information (↑ ökar audittid)" : f.imsD2biz === "1" ? "verkar i icke-reglerad sektor med låg informationsrisk (↓ reducerar tid)" : "verkar i normal verksamhet utan specifika regulatoriska krav (→ neutral)";
    const d2procDesc = f.imsD2proc === "3" ? "har komplexa processer med stor mängd känslig information" : f.imsD2proc === "1" ? "har få och enkla processer med begränsad informationshantering" : "har normala affärsprocesser";
    const d2mgmtDesc = f.imsD2mgmt === "1" ? "har ett välestablerat ISMS med dokumenterade revisioner och fullständig SoA (↓ reducerar audittid)" : f.imsD2mgmt === "3" ? "har ett nytt eller omoget ISMS utan genomförda interna revisioner (↑ ökar audittid)" : "har ett delvis etablerat ISMS (→ neutral)";
    const d3infraDesc = f.imsD3infra === "3" ? "har komplex IT-infrastruktur med segregerade nätverk och höga tillgänglighetskrav" : f.imsD3infra === "1" ? "har en enkel och standardiserad IT-miljö" : "har en normalt diversifierad IT-miljö";
    const d3outDesc = f.imsD3outsource === "3" ? "har högt outsourcingberoende med begränsad insyn i leverantörernas säkerhet" : f.imsD3outsource === "1" ? "har lågt eller välhanterat outsourcingberoende" : "har viss outsourcing med delvis hanterade leverantörsberoenden";
    const d3devDesc = f.imsD3dev === "3" ? "bedriver aktiv systemutveckling som ingår i ISMS-scope" : f.imsD3dev === "1" ? "bedriver ingen systemutveckling" : "bedriver viss begränsad systemutveckling";
    const d4base = "Annex D-analysen (D.2-poäng " + iso27001.d2score + " — " + d4bizLabel + ", D.3-poäng " + iso27001.d3score + " — " + d4itLabel + ") indikerar ett justeringsintervall på " + d4intervalStr + " av C.1-bastalet. " + "Bedömningen baseras på att organisationen " + d2bizDesc + ", " + d2procDesc + ", " + d2mgmtDesc + ", " + d3infraDesc + ", " + d3outDesc + " och " + d3devDesc + ". ";
    const d4desc = iso27001.annexD.pctMin === 0 && iso27001.annexD.pctMax === 0 ? d4base + "Ingen D.4-justering tillämpas för denna kombination." : f.imsD4choice === "conservative" ? d4base + "SBSC tillämpar den nedre gränsen (" + d4choiceStr + ") baserat på att organisationens förutsättningar — ledningssystemets mognad, verksamhetskomplexitet och IT-miljö — sammantaget bedöms som gynnsamma för en effektiv revision." + (f.imsD4reason ? " Motivering: " + f.imsD4reason : "") : f.imsD4choice === "extended" ? d4base + "SBSC tillämpar den övre gränsen (" + d4choiceStr + ") baserat på att organisationens förutsättningar kräver utökad revisionstid." + (f.imsD4reason ? " Motivering: " + f.imsD4reason : "") : d4base + "SBSC tillämpar intervallmittpunkten (" + d4choiceStr + ") som bedöms representera en balanserad uppskattning av revisionsbördan för denna organisation.";
    parts.push(`För ISO 27001 tillämpas SS-EN ISO/IEC 27006-1:2024 §9.1.4.2 (normativt krav att använda Annex C).${c34desc} Bastal Table C.1: ${fmt(iso27001.base)} dag för ${iso27001.persons} pers. inom scope (intervall ${personsRange(iso27001.persons)}). ${d4desc} Justerat bastal: ${fmt(iso27001.afterAnnexD)} dag.` + (reds27 ? ` Ytterligare reduktioner per C.3.5: ${reds27}.` : "") + (adds27 ? ` Tillägg per C.3.5: ${adds27}.` : "") + ` C.3.6: max 30% avvikelse mot Table C.1 (golv ${fmt(iso27001.floor)} dag).`);
    if (iso27001.scopeExt > 0) parts.push(`Scopeutökning per C.7: +${fmt(iso27001.scopeExt)} dag (${f.imsScopeExt === "combined" ? "kombinerat med surveillance/omcertifiering" : "separat audit"}).`);
    parts.push(`Steg 1 (${fmt(iso27001.stage1)} dag): granskning av ISMS-dokumentation, riskbedömning, Statement of Applicability (SoA) och riskbehandlingsplan. Steg 2 (${fmt(iso27001.stage2)} dag): fullständig revision på plats av ISMS-implementering och kontroller.`);
    parts.push(`C.3.7: Faktisk tid på plats ska inte understiga 70% av beräknad total audittid (off-site planering och rapportskrivning inräknat). Resor tillkommer utöver angiven tid.`);
  }
  if (integration) parts.push(`Integrerad revision av ${allStds.join(", ")} — IAF MD 11:2023 §2.1.2: T=${fmt(integration.combined)} dag, integrationsreduktion ${integration.reductionPct} (max 20%).`);
  // Beräkna surveillance och omcertifiering för motiveringstexten
  const allStdsForParts = [...(md5?.stds || []), f.s27001 ? "ISO 27001" : null].filter(Boolean);
  const totalInitForParts = md5 ? md5.totalInit : 0;
  const isoInitForParts = f.s27001 && iso27001 ? iso27001.totalInit : 0;
  const combinedInit = integration ? integration.total : r2(totalInitForParts + isoInitForParts);
  const survForParts = r2(Math.max(combinedInit / 3, 1));
  const recertForParts = r2(Math.max(combinedInit * (2 / 3), 1));
  const survRef = iso27001 ? "IAF MD 5:2023 §5 / 27006-1:2024 C.4" : "IAF MD 5:2023 §5";
  const recertRef = iso27001 ? "IAF MD 5:2023 §6 / 27006-1:2024 C.5" : "IAF MD 5:2023 §6";
  parts.push(`Periodisk revision (år 1 & 2): ${fmt(survForParts)} dag per tillfälle — beräknat som ${fmt(combinedInit)} ÷ 3 = ${(combinedInit / 3).toFixed(2).replace(".", ",")} → avrundat till ${fmt(survForParts)} dag per ${survRef}. Omcertifiering år 3: ${fmt(recertForParts)} dag — beräknat som ${fmt(combinedInit)} × 2/3 = ${(combinedInit * 2 / 3).toFixed(2).replace(".", ",")} → avrundat till ${fmt(recertForParts)} dag per ${recertRef}.`);
  // Regelverksmening — bara inkludera relevanta standarder
  const regelverk = [];
  if (iso27001) regelverk.push("SS-EN ISO/IEC 27006-1:2024 (Annex C normativ, Annex D informativ)");
  if (md5) regelverk.push("IAF MD 5:2023 (Issue 4, V3)");
  if (md5 && md5.stds.length > 1) regelverk.push("IAF MD 11:2023 (Issue 3)");
  if (parseInt(f.sites) > 1) regelverk.push("IAF MD 1:2023 (Issue 3)");
  if (md5?.hasTransfer || f.ex27001) regelverk.push("IAF MD 2:2023 (Issue 2, V2)");
  // IAF MD 5:2023 §8(v) Note: prior knowledge-reduktion ogiltig vid IMS-revision per MD 11
  const imsActiveInMotiv = md5 && iso27001 && !f.iso27001separate && parseInt(f.imsIntLevel || "0") > 0;
  if (imsActiveInMotiv && md5?.existingKeys?.length > 0) {
    parts.push("IAF MD 5:2023 §8(v) Note: Prior knowledge-reduktionen (befintlig certifieringshistorik) tillämpas inte vid IMS-revision per IAF MD 11:2023. IMS-reduktionen ersätter och täcker denna faktor.");
  }
  if (f.koncern && parseInt(f.sites) > 1) {
    const sdetK = (f.siteDetails || []).filter(d => d && (d.city || d.entity));
    const entListK = sdetK.map(d => `${d.entity || "(juridisk enhet ej angiven)"}${d.orgnr ? ` (${d.orgnr})` : ""} — ${d.city || "ort ej angiven"}${d.hq ? " [centralfunktion]" : ""}`).join("; ");
    parts.push(`KONCERNCERTIFIKAT — flera juridiska enheter under ett certifikat. Omfattade enheter: ${entListK || "se platslista"}. Grund: IAF MD 1:2023 §3.3.1 — en multi-site-organisation behöver inte utgöra en enda juridisk enhet, förutsatt att samtliga enheter har en juridisk eller avtalsmässig koppling till centralfunktionen, omfattas av ett enda ledningssystem och att centralfunktionen kan kräva korrigerande åtgärder. Juridisk/avtalsmässig koppling: ${f.koncernQ8 || "ej bedömt"} (§3.3.1). Strukturen avser en sammanhållen koncern, inte fristående organisationer under konstgjort paraply (§1). Behörighetskraven i §5.1–5.6 dokumenteras genom filialkvalifikationen.`);
    parts.push(`Certifikatstruktur per IAF MD 1:2023 §7.8: huvudcertifikatet anger samtliga platser och juridiska enheter med namn och adress (§7.8.2). Eventuella platscertifikat utfärdas med spårbarhet till huvudcertifikatet och med texten att giltigheten beror av huvudcertifikatets giltighet (§7.8.3); platscertifikat utfärdas aldrig i den enskilda enhetens eget namn. Vid allvarlig avvikelse på en enhet nekas/återkallas certifieringen för hela organisationen (§7.7.3–7.8.4).`);
  }
  // ── Samordnad certifieringscykel vid utökning ──────────────────────────
  if (f.certType === "extension" && extCombined) {
    const extOld = [f.extHas9001 && "ISO 9001", f.extHas14001 && "ISO 14001", f.extHas45001 && "ISO 45001"].filter(Boolean);
    const extNew = (md5 ? md5.stds : []).concat(f.s27001 && !f.extHas27001 ? ["ISO 27001"] : []);
    const pos = f.extHas9001 ? (f.ext9001cycle || "surv1") : f.extHas14001 ? (f.ext14001cycle || "surv1") : f.extHas45001 ? (f.ext45001cycle || "surv1") : (f.ext27001cycle || "surv1");
    const posLabel = pos === "recert" ? "omcertifiering" : pos === "surv2" ? "periodisk revision \xE5r 2" : "periodisk revision \xE5r 1";
    parts.push(
      "SAMORDNAD CERTIFIERINGSCYKEL (UT\xD6KNING)\n" +
      "Steg 1 f\xF6r " + extNew.join(", ") + " genomf\xF6rs frist\xE5ende. Steg 2 f\xF6rl\xE4ggs i anslutning till ordinarie " + posLabel + " f\xF6r befintliga certifikat (" + extOld.join(", ") + ") \u2014 kombinerad revision per IAF MD 5:2023 \xA75\u20136; jfr ISO/IEC 27006-1:2024 C.7 f\xF6r ISMS-scopeut\xF6kningar (+0,5 dag vid samordning, +1,0 dag frist\xE5ende). " +
      "Efter ut\xF6kningen harmoniseras certifikatens giltighetstid: framtida periodisk revision och omcertifiering genomf\xF6rs samordnat f\xF6r samtliga standarder. " +
      "Det nya certifikatets f\xF6rsta omcertifiering kan d\xE4rmed ske tidigare \xE4n tre \xE5r efter utf\xE4rdandet \u2014 detta kommuniceras till kund i offerten.\n" +
      "Samordnad framtida cykel (" + extOld.concat(extNew).join(" + ") + "): periodisk revision " + fmt(extCombined.surv) + " dgr/\xE5r \u00B7 omcertifiering " + fmt(extCombined.recert) + " dgr. Ber\xE4knat med samtliga standarder i scope per IAF MD 5:2023 \xA75\u20136 (surv \u2248 1/3, omcert \u2248 2/3 av initialtid f\xF6r d\xE5varande scope)."
    );
  }
  parts.push("Beräkningen följer " + regelverk.join(", ") + " inom ramen för SBSC:s ackreditering av SWEDAC.");
  return parts.join("\n\n");
}

// ── KUNDVÄNLIG MOTIVERINGSTEXT (omformulerad från buildMotiv) ──
function buildCustomerMotiv(f, md5, iso27001, integration, extCombined) {
  const parts = [];
  const allStds = [...(md5?.stds || []), f.s27001 ? "ISO 27001" : null].filter(Boolean);
  const stdText = allStds.length === 1 ? allStds[0]
    : allStds.slice(0, -1).join(", ") + " och " + allStds[allStds.length - 1];
  const cName = f.cName || "er organisation";

  // ── Inledning ──────────────────────────────────────────────────────────
  const certLabel = f.certType === "transfer"
    ? `flytta er befintliga certifiering från ${f.transferOrg || (f.ex27001cb && f.ex27001cb.trim()) || "ert nuvarande certifieringsorgan"} till SBSC`
    : f.certType === "surv" ? "genomföra periodisk revision för"
    : f.certType === "recert" ? "genomföra omcertifiering av"
    : "inleda certifiering av";
  parts.push(
    `Det här är vår bedömning av ${cName} och det ledningssystem vi ska certifiera. ` +
    `Om något inte stämmer — hör av er innan ni signerar, så justerar vi.`
  );

  // ── Faktaruta: Ni och er verksamhet ───────────────────────────────────
  const factLines = [];
  if (md5) {
    const fc = md5.fteCalc;
    const fte = fc && fc.total > 0 ? fc.total : md5.fte > 0 ? md5.fte : parseInt(f.fte) || 0;
    const fteDetail = fc && fc.total > 0 && (fc.part > 0 || fc.seasonal > 0 || fc.contractors > 0)
      ? ` (${[fc.full > 0 ? fc.full + " heltid" : null, fc.part > 0 ? fc.part + " deltid" : null, fc.seasonalEq > 0 ? fc.seasonal + " säsong (högsäsong)" : null, fc.contractors > 0 ? fc.contractors + " inhyrda" : null].filter(Boolean).join(", ")} = ${fte} omräknat till heltid)`
      : "";
    factLines.push(`Antal medarbetare: ${fte}${fteDetail}`);
    if (md5?.similarFteInfo) {
      const si = md5.similarFteInfo;
      factLines.push(`FTE-justering per \xA72.3.4: Verksamheten \xE4r en ${si.verksamhet.toLowerCase()} d\xE4r en h\xF6g andel av personalen utf\xF6r likartade/repetitiva aktiviteter. Enligt IAF MD 5:2023 \xA72.3.4 och SBSC:s fastst\xE4llda rutiner reduceras ber\xE4kningsunderlaget med 30\xA0%: ${si.originalFte}\xA0FTE \u2192 ${si.reducedFte}\xA0pers. Tabelluppslaget baseras p\xE5 ${si.reducedFte}\xA0pers.`);
    }
    if (f.scope) factLines.push(`Verksamhet: ${f.scope}`);
    const cAddr = [f.cStreet, [f.cZip, f.cCity].filter(Boolean).join(" ")].filter(Boolean).join(", ");
    if (cAddr) factLines.push(`Certifieringsplats: ${cAddr}`);
    const matLabel = f.maturity === "high" ? "Väletablerat och välbeprövat — ni har revisionshistorik som visar ett fungerande system."
      : f.maturity === "medium" ? "Etablerat — ert ledningssystem är på plats men relativt nytt."
      : "Under uppbyggnad — vi har beaktat att systemet är i ett tidigt skede.";
    factLines.push(`Ledningssystemets mognad: ${matLabel}`);
    if (f.complexity === "high") factLines.push("Verksamhetskomplexitet: Hög — ni har många unika processer som alla behöver granskas.");
    if (f.offsite === "yes") factLines.push("Fältpersonal: En stor del av er personal arbetar ute hos kunder — revisionen planeras med hänsyn till det.");
    if (f.shifts === "yes") factLines.push("Skiftarbete: Beaktat i revisionsplaneringen.");
    if (f.automation === "high") factLines.push("Automatisering: Hög — maskinella processer granskas primärt via systemkontroll.");
    if (f.regulatory === "high") factLines.push("Regulatoriskt: Hög belastning (t.ex. säkerhetsskyddslagen, NIS2) — beaktat i beräkningen.");
    if (f.notDesignResp === "yes" && f.s9001) factLines.push("Designansvar: Ni tillverkar/levererar efter kundens specifikation — ej designansvariga för produkten.");
    if (f.verySmallSite === "yes") factLines.push("Anläggning: Liten anläggning relativt personalstyrkan — beaktat i beräkningen.");
  }
  if (iso27001) {
    const persons = iso27001.persons || iso27001.totalPersons;
    if (!md5 && f.scope) factLines.push(`Verksamhet: ${f.scope}`);
    if (!md5) {
      const cAddr27 = [f.cStreet, [f.cZip, f.cCity].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      if (cAddr27) factLines.push(`Certifieringsplats: ${cAddr27}`);
    }
    factLines.push(`Informationssäkerhet: ${persons} personer inom ISMS-scope.`);
    const d4bizLabel = iso27001.annexD?.bizCat === "high" ? "hög" : iso27001.annexD?.bizCat === "low" ? "låg" : "medel";
    const d4itLabel = iso27001.annexD?.itCat === "high" ? "hög" : iso27001.annexD?.itCat === "low" ? "låg" : "medel";
    factLines.push(`Verksamhetskomplexitet (ISMS): ${d4bizLabel} — IT-miljökomplexitet: ${d4itLabel}.`);
    const smLabel = f.imsSoaMaturity === "high" ? "Välmognat ISMS med komplett SoA — beaktat positivt." : f.imsSoaMaturity === "low" ? "ISMS under uppbyggnad — beaktat i beräkningen." : "Etablerat ISMS.";
    factLines.push(`ISMS-mognad: ${smLabel}`);
  }
  if (parseInt(f.sites) > 1) {
    const sdet = (f.siteDetails || []).filter(d => d && d.city);
    const siteStr = sdet.length > 0 ? sdet.map(d => `${d.city}${d.hq ? " (centralfunktion)" : ""}`).join(", ") : `${f.sites} platser`;
    factLines.push(`Certifieringsplatser: ${siteStr} — stickprovsmetodik per IAF MD 1:2023.`);
    if (f.koncern && !f.koncernGuideOn) {
      const entK = sdet.filter(d => d.entity).map(d => `${d.entity}${d.orgnr ? ` (${d.orgnr})` : ""}`).join(", ");
      factLines.push(`Koncerncertifikat: ${entK ? `Certifikatet omfattar ${entK}` : "Certifikatet omfattar koncernens angivna bolag"} under ett gemensamt certifikat. Det förutsätter ett gemensamt ledningssystem där koncernens centralfunktion styr, följer upp och kan kräva åtgärder i samtliga bolag. Huvudcertifikatet listar alla bolag och platser; eventuella platsbevis hänvisar alltid till huvudcertifikatet.`);
    }
  }
  if (f.koncernGuideOn) {
    const bolK = f.kBolag || [];

  // Ingen fältbyte — hanteras av DEFAULT_STATE-merge

  // Ingen fältbyte — hanteras av DEFAULT_STATE-merge
